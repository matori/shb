name: CI

on:
  pull_request:
  push:
    branches: [master, v2]

permissions:
  contents: read

# 同じブランチで新しく実行したら、前の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install npm dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier --check src scripts eslint.config.js vite.config.js svelte.config.js
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate dummy API data
        run: npm run validate:mock
